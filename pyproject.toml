[project]
name = "ante"
version = "0.1.0"
description = "Autoresearch loop that pre-registers a forecast and a dollar budget before every experiment"
authors = [
    { name = "pchen41", email = "41307699+pchen41@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.3",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# supply-chain hygiene: only resolve releases that have been public for >= 7 days
exclude-newer = "2026-11-06T00:00:00Z"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
